                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No Simples Nacional, várias atividades de serviço, como medicina, odontologia, psicologia e fisioterapia, podem ser tributadas pelo Anexo III ou pelo Anexo V. Quem decide é o Fator R: a folha de pagamento dos últimos 12 meses (incluindo pró-labore) dividida pela receita bruta do mesmo período. Se o resultado for 28% ou mais, a empresa vai para o Anexo III, com alíquota inicial de 6%. Abaixo disso, fica no Anexo V, que começa em 15,5%."
